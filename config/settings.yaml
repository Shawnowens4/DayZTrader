# DayZ Trader Bot Configuration

bot:
  prefix: "!"
  admin_role: "Trader Admin"
  log_channel: "admin-logs"
  announce_channel: "general"
  trader_channel: "trader"
  market_channel: "player-market"

nitrado:
  base_url: "https://api.nitrado.net"
  # token and server_id loaded from .env
  files:
    types_xml: "/games/{server_id}/noftp/dayzxbox/config/dayzStandalone/mpmissions/dayzOffline.chernarusplus/db/types.xml"
    events_xml: "/games/{server_id}/noftp/dayzxbox/config/dayzStandalone/mpmissions/dayzOffline.chernarusplus/events.xml"
    cfgspawnabletypes: "/games/{server_id}/noftp/dayzxbox/config/dayzStandalone/mpmissions/dayzOffline.chernarusplus/cfgspawnabletypes.xml"
    cfgeconomycore: "/games/{server_id}/noftp/dayzxbox/config/dayzStandalone/mpmissions/dayzOffline.chernarusplus/cfgeconomycore.xml"

economy:
  starting_balance: 1000
  currency_name: "Credits"
  currency_symbol: "💰"
  daily_reward: 500
  daily_cooldown_hours: 24

shop:
  enabled: true
  tax_rate: 0.05  # 5% tax on all purchases
  max_bundle_items: 10
  categories:
    - weapons
    - vehicles
    - clothing
    - food
    - tools
    - ammo
    - medical
    - building

market:
  enabled: true
  listing_fee: 50
  max_listings_per_player: 5
  listing_expiry_hours: 72
  escrow_enabled: true
  min_price: 100
  max_price: 500000

delivery:
  # CE cycle based - NO forced restarts
  item_lifetime_seconds: 7200     # 2 hours to collect
  vehicle_lifetime_seconds: 14400 # 4 hours to collect
  restock_value: 0                # spawn on next CE cycle
  # Pre-configured delivery zones (admin picks on purchase confirm)
  zones:
    NWAF:
      x: 4541.0
      z: 11254.0
      description: "Northwest Airfield"
    Berezino:
      x: 11822.0
      z: 9234.0
      description: "Berezino"
    Elektro:
      x: 10440.0
      z: 2500.0
      description: "Elektrozavodsk"
    Cherno:
      x: 7200.0
      z: 2400.0
      description: "Chernogorsk"
    Balota:
      x: 6091.0
      z: 2400.0
      description: "Balota Airstrip"
    NEAF:
      x: 13412.0
      z: 13100.0
      description: "Northeast Airfield"
    Tisy:
      x: 1050.0
      z: 13210.0
      description: "Tisy Military Base"

raffle:
  enabled: true
  auto_start_weekly: true
  start_day: "monday"
  start_time: "12:00"
  default_entry_cost: 500
  default_max_entries: 10
  default_duration_hours: 168
  announce_channel: "general"
  admin_log_channel: "admin-logs"

casino:
  enabled: true
  games:
    poker:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 30
    blackjack:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 20
    slots:
      enabled: true
      min_bet: 100
      max_bet: 50000
      machines: [classic, diamond, lucky, deluxe, mega]
      cooldown_seconds: 10
    roulette:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 15
    horse_race:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 25
  max_daily_losses: 100000
  loss_warning_threshold: 5000

web:
  host: "0.0.0.0"
  port: 5000
  debug: false
