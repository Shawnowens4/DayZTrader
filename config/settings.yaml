    Airfield: {x: 7580.0, z: 2380.0}
    Berezino: {x: 11832.0, z: 9132.0}
    Cherno: {x: 3005.0, z: 2496.0}
    Elektro: {x: 5765.0, z: 2328.0}
    BalotaAF: {x: 1316.0, z: 2426.0}
    Zelenogorsk: {x: 2506.0, z: 6146.0}
    Vybor: {x: 3852.0, z: 8450.0}

casino:
  enabled: true
  min_bet: 100
  max_bet: 50000
  max_daily_losses: 100000
