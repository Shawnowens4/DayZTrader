# ============================================================
# DayZ Trader Bot - Full Configuration
# ============================================================

bot:
  prefix: "!"
  guild_id: 0                        # YOUR Discord server ID
  admin_role: "Trader Admin"
  log_channel: "admin-logs"
  delivery_log_channel: "delivery-log"
  announcement_channel: "general"

nitrado:
  token: ""                          # Nitrado API token (use .env)
  server_id: ""                      # Nitrado server ID (use .env)
  base_url: "https://api.nitrado.net"
  # Paths to your server XML files on Nitrado
  paths:
    types:          "/games/{id}/ftpserver/mpmissions/dayzOffline.chernarusplus/db/types.xml"
    events:         "/games/{id}/ftpserver/mpmissions/dayzOffline.chernarusplus/db/events.xml"
    spawnabletypes: "/games/{id}/ftpserver/mpmissions/dayzOffline.chernarusplus/cfgspawnabletypes.xml"
    economycore:    "/games/{id}/ftpserver/mpmissions/dayzOffline.chernarusplus/cfgeconomycore.xml"

economy:
  starting_balance: 1000
  daily_reward: 500
  daily_cooldown_hours: 24
  max_balance: 10000000
  currency_name: "Credits"
  currency_emoji: "💰"

shop:
  enabled: true
  max_stock_per_item: 999
  price_floor: 100
  price_ceiling: 5000000
  categories:
    - weapons
    - vehicles
    - clothing
    - food
    - tools
    - ammo
    - misc

market:
  enabled: true
  max_listings_per_player: 5
  listing_fee_pct: 5             # % of asking price charged to seller on listing
  max_listing_duration_days: 7
  min_price: 100
  max_price: 5000000
  escrow_enabled: true
  auto_expire_check_minutes: 30

delivery:
  # CE cycle timing - NEVER force restart
  item_lifetime_seconds: 7200     # 2 hours for players to collect items
  vehicle_lifetime_seconds: 14400 # 4 hours for players to collect vehicles
  restock_value: 0                # 0 = spawn on next CE cycle (~1-5 min)
  queue_delay_seconds: 3          # delay between sequential XML edits
  max_retry_attempts: 3
  # Status update DMs
  dm_on_queued: true
  dm_on_delivered: true
  dm_on_failed: true

raffle:
  enabled: true
  auto_start_weekly: true
  start_day: "monday"
  start_time: "12:00"             # UTC
  default_entry_cost: 500
  default_max_entries: 10
  default_duration_hours: 168     # 1 week
  announce_channel: "general"
  admin_log_channel: "admin-logs"
  auto_announce_winners: true
  dm_winners: true

casino:
  enabled: true
  games:
    poker:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 30
    blackjack:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 20
    slots:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 10
    roulette:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 15
    horse_race:
      enabled: true
      min_bet: 100
      max_bet: 50000
      cooldown_seconds: 25
  max_daily_losses: 100000
  loss_warning_threshold: 5000
  large_win_threshold: 50000
  large_win_log_channel: "admin-logs"

web:
  host: "0.0.0.0"
  port: 5000
  debug: false
  # Set via .env: WEB_API_KEY
  rate_limit: "100 per minute"
  cors_origins:
    - "https://trader.yourdomain.com"

map:
  default_lat: 47.0
  default_lng: 50.0
  default_zoom: 4
  tile_url: "https://www.izurvive.com/chernarusplus/tiles/{z}/{x}/{y}.png"
  tile_attribution: "&copy; iZurvive | &copy; Bohemia Interactive"
  max_zoom: 7
  min_zoom: 1
