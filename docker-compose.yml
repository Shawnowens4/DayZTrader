services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./dxemb:/app/dxemb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./dxemb:/app/dxemb
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dxemb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dxemb_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dxemb}
    volumes:
      - dxemb_db_data:/var/lib/postgresql/data
      - ./dxemb/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxemb -d dxemb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dxemb_db_data:
